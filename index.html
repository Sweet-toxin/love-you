<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Любовь в конверте</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    padding: 20px;
  }
  .container {
    width: 100%;
    max-width: 560px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(12px);
    border-radius: 24px;
    padding: 32px 24px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  h1 {
    text-align: center;
    color: #ffb3c6;
    font-size: 1.6rem;
    margin-bottom: 6px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .subtitle {
    text-align: center;
    color: rgba(255,255,255,0.5);
    font-size: 0.82rem;
    margin-bottom: 24px;
  }
  label {
    display: block;
    color: rgba(255,255,255,0.75);
    font-size: 0.8rem;
    margin: 14px 0 6px;
    font-weight: 500;
  }
  input, textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    color: #fff;
    font-size: 0.95rem;
    outline: none;
    transition: border 0.2s;
    font-family: inherit;
  }
  input:focus, textarea:focus { border-color: #ffb3c6; }
  textarea { resize: vertical; min-height: 80px; }
  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.2s;
    margin-top: 18px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(135deg, #ff6b9d, #c44569);
    color: #fff;
  }
  .btn-secondary {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .link-box {
    margin-top: 16px;
    padding: 14px;
    background: rgba(0,0,0,0.25);
    border-radius: 12px;
    word-break: break-all;
    font-size: 0.78rem;
    color: #ffb3c6;
    display: none;
    border: 1px dashed rgba(255,179,198,0.4);
  }
  .link-box.show { display: block; }
  .status {
    text-align: center;
    margin-top: 12px;
    font-size: 0.82rem;
    color: rgba(255,255,255,0.55);
    min-height: 1.2em;
  }

  /* ===== Сцена открытки ===== */
  .scene {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    width: 100%;
    max-width: 560px;
    animation: fadeIn 0.6s ease;
  }
  .scene.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .envelope-wrap {
    cursor: pointer;
    perspective: 1000px;
    width: 280px;
    height: 200px;
    position: relative;
    margin: 20px auto;
    transition: transform 0.2s;
  }
  .envelope-wrap:active { transform: scale(0.97); }

  .env-body {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 160px;
    background: linear-gradient(145deg, #e8456b, #c23152);
    border-radius: 8px 8px 16px 16px;
    box-shadow: 0 12px 40px rgba(232,69,107,0.35);
  }
  .env-flap {
    position: absolute;
    top: 0;
    width: 100%;
    height: 100px;
    background: linear-gradient(180deg, #d63a5e, #e8456b);
    clip-path: polygon(0 0, 50% 100%, 100% 0);
    transform-origin: top center;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s 0.3s;
    z-index: 4;
    border-radius: 8px 8px 0 0;
  }
  .envelope-wrap.open .env-flap {
    transform: rotateX(180deg);
    z-index: 1;
  }
  .letter-preview {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(30px);
    width: 88%;
    height: 120px;
    background: #fff8f0;
    border-radius: 6px;
    z-index: 3;
    transition: transform 0.6s 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    padding: 12px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  .envelope-wrap.open .letter-preview {
    transform: translateX(-50%) translateY(-40px);
    z-index: 5;
  }
  .letter-preview .heart-icon {
    font-size: 1.4rem;
    text-align: center;
    line-height: 1;
  }
  .letter-preview .preview-text {
    font-size: 0.65rem;
    color: #8b5a5a;
    text-align: center;
    margin-top: 6px;
    line-height: 1.4;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }
  .hint {
    color: rgba(255,255,255,0.5);
    font-size: 0.85rem;
    text-align: center;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

  /* ===== Полная открытка (после клика) ===== */
  .full-card {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    width: 100%;
    animation: fadeIn 0.8s ease;
  }
  .full-card.show { display: flex; }

  .card-canvas-wrap {
    position: relative;
    width: 100%;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 16px 50px rgba(0,0,0,0.5);
  }
  #cardCanvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 20px;
  }
  .music-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    color: rgba(255,255,255,0.6);
    font-size: 0.78rem;
  }
  .music-indicator .dot {
    width: 6px; height: 6px;
    background: #ffb3c6;
    border-radius: 50%;
    animation: blink 1s infinite alternate;
  }
  @keyframes blink { from { opacity: 0.2; } to { opacity: 1; } }

  .action-row {
    display: flex;
    gap: 10px;
    width: 100%;
    flex-wrap: wrap;
  }
  .action-row .btn { flex: 1; min-width: 140px; margin-top: 0; font-size: 0.88rem; padding: 12px; }

  .back-link {
    color: rgba(255,255,255,0.4);
    font-size: 0.78rem;
    cursor: pointer;
    text-decoration: underline;
    margin-top: 8px;
  }
  .back-link:hover { color: #ffb3c6; }

  @media (max-width: 480px) {
    .envelope-wrap { width: 240px; height: 180px; }
    .env-body { height: 140px; }
    .env-flap { height: 90px; }
    .letter-preview { height: 105px; }
    .container { padding: 24px 18px; }
  }
</style>
</head>
<body>

<!-- ===== ФОРМА СОЗДАНИЯ ===== -->
<div class="container" id="createPanel">
  <h1>💌 Любовь в конверте</h1>
  <p class="subtitle">Создайте открытку и отправьте ссылкой</p>

  <label>Кому (имя получателя)</label>
  <input type="text" id="toName" placeholder="Например: Ане" maxlength="40">

  <label>От кого (ваше имя)</label>
  <input type="text" id="fromName" placeholder="Например: от Максима" maxlength="40">

  <label>Текст поздравления</label>
  <textarea id="message" placeholder="Напишите что-то тёплое..." maxlength="300"></textarea>

  <label>Ссылка на музыку (MP3, прямой URL)</label>
  <input type="url" id="musicUrl" placeholder="https://example.com/song.mp3">

  <button class="btn btn-primary" id="generateBtn">Создать открытку</button>
  <div class="link-box" id="linkBox"></div>
  <div class="status" id="status"></div>
</div>

<!-- ===== СЦЕНА: КОНВЕРТ ===== -->
<div class="scene" id="envelopeScene">
  <h1 style="color:#ffb3c6; font-size:1.3rem;">У вас открытка 💌</h1>
  <div class="envelope-wrap" id="envelopeWrap">
    <div class="env-body"></div>
    <div class="env-flap"></div>
    <div class="letter-preview">
      <div class="heart-icon">💗</div>
      <div class="preview-text" id="previewText"></div>
    </div>
  </div>
  <div class="hint">Нажмите на конверт, чтобы открыть</div>
</div>

<!-- ===== ПОЛНАЯ ОТКРЫТКА ===== -->
<div class="full-card" id="fullCard">
  <div class="card-canvas-wrap">
    <canvas id="cardCanvas" width="1080" height="1350"></canvas>
  </div>
  <div class="music-indicator" id="musicIndicator" style="display:none;">
    <span class="dot"></span> Музыка играет
  </div>
  <div class="action-row">
    <button class="btn btn-primary" id="downloadBtn">💾 Скачать картинку</button>
    <button class="btn btn-secondary" id="copyLinkBtn">🔗 Скопировать ссылку</button>
  </div>
  <div class="back-link" id="backLink">← Создать свою открытку</div>
</div>

<audio id="bgMusic" loop preload="none"></audio>

<script>
(function() {
  'use strict';

  // ===== Элементы =====
  const createPanel = document.getElementById('createPanel');
  const envelopeScene = document.getElementById('envelopeScene');
  const fullCard = document.getElementById('fullCard');
  const toName = document.getElementById('toName');
  const fromName = document.getElementById('fromName');
  const message = document.getElementById('message');
  const musicUrl = document.getElementById('musicUrl');
  const generateBtn = document.getElementById('generateBtn');
  const linkBox = document.getElementById('linkBox');
  const status = document.getElementById('status');
  const envelopeWrap = document.getElementById('envelopeWrap');
  const previewText = document.getElementById('previewText');
  const canvas = document.getElementById('cardCanvas');
  const ctx = canvas.getContext('2d');
  const bgMusic = document.getElementById('bgMusic');
  const musicIndicator = document.getElementById('musicIndicator');
  const downloadBtn = document.getElementById('downloadBtn');
  const copyLinkBtn = document.getElementById('copyLinkBtn');
  const backLink = document.getElementById('backLink');

  let currentData = null;

  // ===== Утилиты =====
  function encodeData(obj) {
    const json = JSON.stringify(obj);
    // UTF-8 безопасное base64
    const bytes = new TextEncoder().encode(json);
    let binary = '';
    bytes.forEach(b => binary += String.fromCharCode(b));
    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function decodeData(str) {
    try {
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      const binary = atob(str);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return JSON.parse(new TextDecoder().decode(bytes));
    } catch(e) { return null; }
  }

  function getDataFromHash() {
    const hash = location.hash.slice(1);
    if (!hash) return null;
    return decodeData(hash);
  }

  // ===== Создание ссылки =====
  generateBtn.addEventListener('click', function() {
    const data = {
      to: toName.value.trim() || 'Любимому человеку',
      from: fromName.value.trim() || 'От всего сердца',
      msg: message.value.trim() || 'Ты — моё самое любимое чудо на свете.',
      music: musicUrl.value.trim() || ''
    };

    const encoded = encodeData(data);
    const base = location.origin + location.pathname;
    const url = base + '#' + encoded;

    linkBox.textContent = url;
    linkBox.classList.add('show');
    status.textContent = 'Ссылка готова! Скопируйте и отправьте.';

    // Автокопирование
    navigator.clipboard.writeText(url).then(() => {
      status.textContent = 'Ссылка скопирована в буфер обмена ✓';
    }).catch(() => {});

    // Показываем превью сразу
    showEnvelope(data);
  });

  // ===== Показ конверта =====
  function showEnvelope(data) {
    currentData = data;
    createPanel.style.display = 'none';
    envelopeScene.classList.add('active');
    fullCard.classList.remove('show');
    envelopeWrap.classList.remove('open');
    previewText.textContent = data.msg.substring(0, 60) + (data.msg.length > 60 ? '…' : '');
    // Настраиваем музыку
    if (data.music) {
      bgMusic.src = data.music;
      bgMusic.load();
    }
  }

  // ===== Открытие конверта =====
  envelopeWrap.addEventListener('click', function() {
    if (envelopeWrap.classList.contains('open')) return;
    envelopeWrap.classList.add('open');

    // Запуск музыки (после клика — разрешено браузером)
    if (currentData && currentData.music) {
      bgMusic.play().then(() => {
        musicIndicator.style.display = 'flex';
      }).catch(() => {
        // Если не удалось — не страшно
      });
    }

    // Через 800ms показываем полную открытку
    setTimeout(() => {
      envelopeScene.classList.remove('active');
      fullCard.classList.add('show');
      drawCard(currentData);
    }, 900);
  });

  // ===== Рисование открытки на canvas =====
  function drawCard(data) {
    const W = canvas.width;
    const H = canvas.height;

    // Фон
    const gradient = ctx.createLinearGradient(0, 0, W, H);
    gradient.addColorStop(0, '#1a1a2e');
    gradient.addColorStop(0.5, '#16213e');
    gradient.addColorStop(1, '#0f3460');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    // Рамка
    ctx.strokeStyle = 'rgba(255,179,198,0.3)';
    ctx.lineWidth = 3;
    ctx.strokeRect(40, 40, W - 80, H - 80);

    // Сердечко
    ctx.font = '120px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('💗', W/2, H * 0.18);

    // «Кому»
    ctx.fillStyle = '#ffb3c6';
    ctx.font = 'bold 48px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(data.to, W/2, H * 0.30);

    // Линия
    ctx.strokeStyle = 'rgba(255,179,198,0.25)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W * 0.2, H * 0.36);
    ctx.lineTo(W * 0.8, H * 0.36);
    ctx.stroke();

    // Текст сообщения (с переносом)
    ctx.fillStyle = '#ffffff';
    ctx.font = '36px "Segoe UI", system-ui, sans-serif';
    const msg = data.msg;
    const maxWidth = W * 0.75;
    const lineHeight = 52;
    const words = msg.split(' ');
    let lines = [];
    let currentLine = '';
    for (const word of words) {
      const test = currentLine ? currentLine + ' ' + word : word;
      if (ctx.measureText(test).width > maxWidth && currentLine) {
        lines.push(currentLine);
        currentLine = word;
      } else {
        currentLine = test;
      }
    }
    if (currentLine) lines.push(currentLine);

    const totalTextHeight = lines.length * lineHeight;
    const textStartY = H * 0.48 - totalTextHeight / 2 + lineHeight / 2;

    lines.forEach((line, i) => {
      ctx.fillText(line, W/2, textStartY + i * lineHeight);
    });

    // «От кого»
    ctx.fillStyle = 'rgba(255,179,198,0.8)';
    ctx.font = 'italic 32px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(data.from, W/2, H * 0.82);

    // Подпись снизу
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.font = '24px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('Любовь в конверте', W/2, H * 0.92);
  }

  // ===== Скачивание картинки =====
  downloadBtn.addEventListener('click', function() {
    if (!currentData) return;
    const link = document.createElement('a');
    link.download = 'love-card.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  // ===== Копирование ссылки (в сцене открытки) =====
  copyLinkBtn.addEventListener('click', function() {
    navigator.clipboard.writeText(location.href).then(() => {
      const original = copyLinkBtn.textContent;
      copyLinkBtn.textContent = '✓ Скопировано';
      setTimeout(() => { copyLinkBtn.textContent = original; }, 1500);
    }).catch(() => {
      prompt('Скопируйте ссылку:', location.href);
    });
  });

  // ===== Назад к созданию =====
  backLink.addEventListener('click', function() {
    location.hash = '';
    location.reload();
  });

  // ===== Инициализация при загрузке =====
  function init() {
    const data = getDataFromHash();
    if (data) {
      // Режим получателя
      showEnvelope(data);
    } else {
      // Режим создателя
      createPanel.style.display = 'block';
      envelopeScene.classList.remove('active');
      fullCard.classList.remove('show');
    }
  }

  init();
})();
</script>
</body>
</html>
